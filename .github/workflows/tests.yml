name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: both-ways scorer tests
        run: python -I tests/test_score.py
      - name: research-grade checks (self-test, retractions, claims index, manifest)
        run: python -I research_grade.py
